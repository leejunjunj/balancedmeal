<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>맞춤형 스마트 식단 플래너</title>

    <!-- Safari Web App Setup -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="식단 플래너">

    <style>
        :root {
            --primary: #4CAF50;
            --primary-dark: #2E7D32;
            --primary-light: #E8F5E9;
            --secondary: #2196F3;
            --accent: #FF9800;
            --cheat-color: #E91E63;
            --cheat-bg: #FCE4EC;
            --bg: #F4F6F8;
            --card-bg: #FFFFFF;
            --text: #333333;
            --text-muted: #777777;
            --border: #E2E8F0;
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 16px;
            max-width: 768px;
            margin: 0 auto;
            padding-bottom: 50px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.5rem;
            color: var(--primary-dark);
            margin-bottom: 4px;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 18px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.06);
            margin-bottom: 20px;
        }

        /* 1. 오늘의 식단 섹션 (한 줄 3칸 박스 배치) */
        .today-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .today-title {
            font-size: 1.15rem;
            font-weight: bold;
            color: var(--primary-dark);
        }

        .today-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .meal-box {
            background: var(--primary-light);
            border-radius: 12px;
            padding: 12px 8px;
            border-top: 4px solid var(--primary);
            min-height: 110px;
            display: flex;
            flex-direction: column;
            transition: all 0.2s;
        }

        .meal-box.is-cheat {
            background: var(--cheat-bg);
            border-top-color: var(--cheat-color);
        }

        .meal-box-header {
            font-size: 0.82rem;
            font-weight: bold;
            color: #1B5E20;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 2px;
        }

        .meal-box.is-cheat .meal-box-header {
            color: var(--cheat-color);
        }

        .cheat-tag {
            background: var(--cheat-color);
            color: white;
            font-size: 0.65rem;
            padding: 1px 5px;
            border-radius: 8px;
            font-weight: bold;
        }

        .meal-box-content {
            font-size: 0.85rem;
            font-weight: 600;
            line-height: 1.35;
            color: #1E293B;
            word-break: keep-all;
        }

        /* 2. 캘린더 섹션 */
        .calendar-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .btn {
            background: #ffffff;
            border: 1px solid var(--border);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .btn-toggle {
            background: var(--primary-light);
            color: var(--primary-dark);
            border: 1px solid var(--primary);
        }

        .calendar-grid-week {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }

        .calendar-grid-month {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }

        .day-card {
            background: #FAFAFA;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px 4px;
            min-height: 110px;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: border 0.2s;
        }

        .day-card:hover {
            border-color: var(--primary);
        }

        .day-card.today {
            border: 2px solid var(--primary);
            background: #FFFFFF;
        }

        .day-number {
            font-weight: bold;
            font-size: 0.82rem;
            text-align: center;
            margin-bottom: 6px;
            color: #475569;
        }

        .day-card.today .day-number {
            color: var(--primary-dark);
        }

        .day-meal {
            font-size: 0.68rem;
            margin-top: 3px;
            padding: 3px 4px;
            background: #FFFFFF;
            border-radius: 5px;
            border: 1px solid #E2E8F0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .day-meal.cheat-meal-slot {
            background: var(--cheat-bg);
            border-color: #F8BBD0;
            color: var(--cheat-color);
            font-weight: bold;
        }

        .day-meal span {
            font-weight: bold;
            color: var(--primary);
        }

        /* 3. 식단 생성 & 치팅 폼 섹션 */
        .tab-group {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
            background: #F1F5F9;
            padding: 4px;
            border-radius: 10px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px 6px;
            background: transparent;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.82rem;
            color: #64748B;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: white;
            color: var(--primary-dark);
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
        }

        .tab-btn.cheat-tab.active {
            color: var(--cheat-color);
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
        }

        .input-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .input-group label {
            font-size: 0.8rem;
            font-weight: bold;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .equiv-tag {
            font-size: 0.72rem;
            color: #2E7D32;
            background: #E8F5E9;
            padding: 2px 6px;
            border-radius: 6px;
            font-weight: 600;
        }

        .input-group input, .input-group select {
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: var(--primary);
        }

        .focus-options {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .focus-btn {
            flex: 1;
            padding: 10px 4px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: white;
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 600;
        }

        .focus-btn.selected {
            border-color: var(--secondary);
            background: #E3F2FD;
            color: var(--secondary);
            font-weight: bold;
        }

        .cheat-presets {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
        }

        .preset-chip {
            background: #F1F5F9;
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .preset-chip:hover {
            background: var(--cheat-bg);
            border-color: var(--cheat-color);
            color: var(--cheat-color);
        }

        .action-btn {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            box-shadow: 0 4px 10px rgba(76, 175, 80, 0.25);
        }

        .action-btn.cheat-btn {
            background: var(--cheat-color);
            box-shadow: 0 4px 10px rgba(233, 30, 99, 0.25);
        }

        /* 모달 팝업 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            border-radius: var(--radius);
            padding: 20px;
            max-width: 500px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .preview-item {
            background: #F8FAFC;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 0.88rem;
            line-height: 1.5;
            border-left: 4px solid var(--primary);
        }

        .modal-actions {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }
    </style>
</head>
<body>

    <header>
        <h1>🥗 스마트 식단 플래너</h1>
    </header>

    <!-- 상단: 오늘의 식단 (한 줄 3개 나란히 배치) -->
    <section class="card">
        <div class="today-header">
            <span class="today-title">📌 오늘의 식단</span>
            <span id="todayDateStr" style="font-size:0.85rem; font-weight: bold; color:#64748B;"></span>
        </div>

        <div class="today-grid">
            <!-- 아침 -->
            <div id="breakfastBox" class="meal-box">
                <div class="meal-box-header">
                    <span>🌅 아침</span>
                    <span id="breakfastCheatTag" class="cheat-tag" style="display:none;">치팅</span>
                </div>
                <div id="todayBreakfastContent" class="meal-box-content">등록 없음</div>
            </div>

            <!-- 점심 -->
            <div id="lunchBox" class="meal-box">
                <div class="meal-box-header">
                    <span>☀️ 점심</span>
                    <span id="lunchCheatTag" class="cheat-tag" style="display:none;">치팅</span>
                </div>
                <div id="todayLunchContent" class="meal-box-content">등록 없음</div>
            </div>

            <!-- 저녁 -->
            <div id="dinnerBox" class="meal-box">
                <div class="meal-box-header">
                    <span>🌙 저녁</span>
                    <span id="dinnerCheatTag" class="cheat-tag" style="display:none;">치팅</span>
                </div>
                <div id="todayDinnerContent" class="meal-box-content">등록 없음</div>
            </div>
        </div>
    </section>

    <!-- 중단: 캘린더 (주간 / 월간) -->
    <section class="card">
        <div class="calendar-controls">
            <div>
                <button class="btn" onclick="navigateCalendar(-1)">◀ 이전</button>
                <span id="calendarTitle" style="font-weight:bold; margin: 0 8px; font-size: 0.95rem;"></span>
                <button class="btn" onclick="navigateCalendar(1)">다음 ▶</button>
            </div>
            <button class="btn btn-toggle" id="viewToggleBtn" onclick="toggleCalendarView()">월간 보기</button>
        </div>
        <div id="calendarGrid" class="calendar-grid-week"></div>
    </section>

    <!-- 하단: 식단 생성 & 치팅 데이 입력 폼 -->
    <section class="card">
        <h2 style="font-size: 1.05rem; margin-bottom: 12px;">⚙️ 식단 설정 및 치팅 데이</h2>
        
        <div class="tab-group">
            <button class="tab-btn active" onclick="switchTab('macros')">탄단지 기준</button>
            <button class="tab-btn" onclick="switchTab('calories')">칼로리 기준</button>
            <button class="tab-btn cheat-tab" onclick="switchTab('cheat')">🎉 치팅 데이!</button>
        </div>

        <!-- 탭 1: 탄단지 & 식이섬유 입력 (음식 환산 수치 포함) -->
        <div id="macrosForm" class="form-section active">
            <div class="input-grid">
                <div class="input-group">
                    <label>
                        <span>탄수화물 (g)</span>
                        <span id="carbEquiv" class="equiv-tag">🍚 약 2.9공기</span>
                    </label>
                    <input type="number" id="inputCarb" placeholder="예: 200" value="200" oninput="updateMacroEquivalents()">
                </div>
                <div class="input-group">
                    <label>
                        <span>단백질 (g)</span>
                        <span id="proteinEquiv" class="equiv-tag">🍗 약 4개</span>
                    </label>
                    <input type="number" id="inputProtein" placeholder="예: 100" value="100" oninput="updateMacroEquivalents()">
                </div>
                <div class="input-group">
                    <label>
                        <span>지방 (g)</span>
                        <span id="fatEquiv" class="equiv-tag">🥜 약 100알</span>
                    </label>
                    <input type="number" id="inputFat" placeholder="예: 50" value="50" oninput="updateMacroEquivalents()">
                </div>
                <div class="input-group">
                    <label>
                        <span>식이섬유 (g)</span>
                        <span id="fiberEquiv" class="equiv-tag">🥬 약 1통</span>
                    </label>
                    <input type="number" id="inputFiber" placeholder="예: 25" value="25" oninput="updateMacroEquivalents()">
                </div>
            </div>
            <div class="input-grid">
                <div class="input-group">
                    <label>시작일</label>
                    <input type="date" id="macroStartDate">
                </div>
                <div class="input-group">
                    <label>적용 기간 (일)</label>
                    <input type="number" id="macroDays" value="7" min="1" max="31">
                </div>
            </div>
            <button class="action-btn" onclick="generateByMacros()">맞춤 식단 생성 및 컨펌</button>
        </div>

        <!-- 탭 2: 칼로리 및 영양 강조 -->
        <div id="caloriesForm" class="form-section">
            <div class="input-group" style="margin-bottom: 12px;">
                <label>목표 하루 칼로리 (kcal)</label>
                <input type="number" id="inputCalorie" placeholder="예: 2000" value="2000">
            </div>
            <div style="margin-bottom: 12px;">
                <label style="font-size: 0.8rem; font-weight: bold; color: var(--text-muted); display:block; margin-bottom: 6px;">영양 위주 선택</label>
                <div class="focus-options">
                    <button class="focus-btn selected" onclick="selectFocus(this, 'protein')">🍗 단백질 위주</button>
                    <button class="focus-btn" onclick="selectFocus(this, 'fiber')">🥗 식이섬유 위주</button>
                    <button class="focus-btn" onclick="selectFocus(this, 'carb')">🍚 탄수화물 위주</button>
                </div>
            </div>
            <div class="input-grid">
                <div class="input-group">
                    <label>시작일</label>
                    <input type="date" id="calStartDate">
                </div>
                <div class="input-group">
                    <label>종료일</label>
                    <input type="date" id="calEndDate">
                </div>
            </div>
            <button class="action-btn" onclick="generateByCalories()">칼로리 식단 추천 및 컨펌</button>
        </div>

        <!-- 탭 3: 치팅 데이 설정 -->
        <div id="cheatForm" class="form-section">
            <div class="input-group" style="margin-bottom: 12px;">
                <label>먹고 싶은 치팅 메뉴 🍕</label>
                <input type="text" id="cheatMenuInput" placeholder="예: 양념치킨 & 맥주, 엽기떡볶이">
            </div>

            <div class="cheat-presets">
                <span class="preset-chip" onclick="setCheatPreset('양념치킨 🍗')">🍗 치킨</span>
                <span class="preset-chip" onclick="setCheatPreset('페퍼로니 피자 🍕')">🍕 피자</span>
                <span class="preset-chip" onclick="setCheatPreset('매콤 떡볶이 🥘')">🥘 떡볶이</span>
                <span class="preset-chip" onclick="setCheatPreset('삼겹살 & 비빔면 🥓')">🥓 삼겹살</span>
                <span class="preset-chip" onclick="setCheatPreset('짜장면 & 탕수육 🥢')">🥢 중식</span>
            </div>

            <div class="input-grid">
                <div class="input-group">
                    <label>치팅 날짜</label>
                    <input type="date" id="cheatDate">
                </div>
                <div class="input-group">
                    <label>치팅 식사 타임</label>
                    <select id="cheatMealType">
                        <option value="all">하루 전체 (자유식)</option>
                        <option value="breakfast">아침</option>
                        <option value="lunch" selected>점심</option>
                        <option value="dinner">저녁</option>
                    </select>
                </div>
            </div>
            <button class="action-btn cheat-btn" onclick="addCheatMeal()">🎉 치팅 식단으로 등록하기</button>
        </div>
    </section>

    <!-- 식단 확인 컨펌 모달 -->
    <div id="confirmModal" class="modal">
        <div class="modal-content">
            <div class="modal-title">📋 식단 미리보기 및 컨펌</div>
            <p style="font-size:0.85rem; color:#666; margin-bottom:12px;">아래 식단으로 달력 및 오늘의 식단에 즉시 적용할까요?</p>
            <div id="previewList"></div>
            <div class="modal-actions">
                <button class="btn" style="flex:1;" onclick="closeModal()">취소</button>
                <button class="btn" style="flex:1; background:var(--primary); color:white; border:none;" onclick="confirmAndSave()">확인 및 등록</button>
            </div>
        </div>
    </div>

    <script>
        // --- 데이터 상태 ---
        let currentCalendarMode = 'week'; 
        let calendarBaseDate = new Date();
        let selectedFocus = 'protein';
        let pendingPlan = [];

        // 로컬스토리지 저장 데이터 불러오기
        let mealData = JSON.parse(localStorage.getItem('mealDataStore')) || {};

        // 추천 메뉴 샘플 데이터
        const dbCarbs = ["현미밥 1공기", "잡곡밥", "찐 고구마 1개", "통밀 식빵 2장", "바나나 1개", "오트밀 죽"];
        const dbProteins = ["닭가슴살 구이", "삶은 계란 2개", "소고기 우둔살", "연어 구이", "두부 구이", "돼지 안심 살코기"];
        const dbFibers = ["야채 샐러드", "브로콜리 데침", "방울토마토 10개", "사과 반 개", "나물 무침", "양배추 쌈"];

        // 초기화
        window.onload = function() {
            const todayStr = getFormattedDate(new Date());
            document.getElementById('macroStartDate').value = todayStr;
            document.getElementById('calStartDate').value = todayStr;
            document.getElementById('cheatDate').value = todayStr;
            
            let defaultEnd = new Date();
            defaultEnd.setDate(defaultEnd.getDate() + 6);
            document.getElementById('calEndDate').value = getFormattedDate(defaultEnd);

            updateMacroEquivalents();
            renderTodayMeals();
            renderCalendar();
        };

        function getFormattedDate(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        // --- 실물 음식 환산 수치 계산 (실시간 이벤트) ---
        function updateMacroEquivalents() {
            const carb = parseFloat(document.getElementById('inputCarb').value) || 0;
            const protein = parseFloat(document.getElementById('inputProtein').value) || 0;
            const fat = parseFloat(document.getElementById('inputFat').value) || 0;
            const fiber = parseFloat(document.getElementById('inputFiber').value) || 0;

            // 평균 기준: 쌀밥 1공기(70g), 닭가슴살 1개(25g), 아몬드 1알(0.5g), 양배추 1통(25g)
            const riceBowls = (carb / 70).toFixed(1);
            const chickenBreasts = (protein / 25).toFixed(1);
            const almonds = Math.round(fat / 0.5);
            const cabbages = (fiber / 25).toFixed(1);

            document.getElementById('carbEquiv').innerText = `🍚 약 ${riceBowls}공기`;
            document.getElementById('proteinEquiv').innerText = `🍗 약 ${chickenBreasts}개`;
            document.getElementById('fatEquiv').innerText = `🥜 약 ${almonds}알`;
            document.getElementById('fiberEquiv').innerText = `🥬 약 ${cabbages}통`;
        }

        // --- 오늘의 식단 렌더링 ---
        function renderTodayMeals() {
            const todayKey = getFormattedDate(new Date());
            document.getElementById('todayDateStr').innerText = todayKey;

            const updateSlot = (boxId, contentId, tagId, text) => {
                const box = document.getElementById(boxId);
                const content = document.getElementById(contentId);
                const tag = document.getElementById(tagId);

                if (text) {
                    content.innerText = text;
                    if (text.includes('[치팅]')) {
                        box.classList.add('is-cheat');
                        tag.style.display = 'inline-block';
                    } else {
                        box.classList.remove('is-cheat');
                        tag.style.display = 'none';
                    }
                } else {
                    content.innerText = "등록 없음";
                    box.classList.remove('is-cheat');
                    tag.style.display = 'none';
                }
            };

            const todayData = mealData[todayKey] || {};
            updateSlot('breakfastBox', 'todayBreakfastContent', 'breakfastCheatTag', todayData.breakfast);
            updateSlot('lunchBox', 'todayLunchContent', 'lunchCheatTag', todayData.lunch);
            updateSlot('dinnerBox', 'todayDinnerContent', 'dinnerCheatTag', todayData.dinner);
        }

        // --- 캘린더 렌더링 ---
        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';

            if (currentCalendarMode === 'week') {
                grid.className = 'calendar-grid-week';
                renderWeekView(grid);
            } else {
                grid.className = 'calendar-grid-month';
                renderMonthView(grid);
            }
        }

        function renderWeekView(container) {
            const startOfWeek = new Date(calendarBaseDate);
            const dayOfWeek = startOfWeek.getDay();
            startOfWeek.setDate(startOfWeek.getDate() - dayOfWeek);

            const endOfWeek = new Date(startOfWeek);
            endOfWeek.setDate(endOfWeek.getDate() + 6);

            document.getElementById('calendarTitle').innerText = 
                `${startOfWeek.getMonth() + 1}.${startOfWeek.getDate()} ~ ${endOfWeek.getMonth() + 1}.${endOfWeek.getDate()}`;

            for (let i = 0; i < 7; i++) {
                const day = new Date(startOfWeek);
                day.setDate(day.getDate() + i);
                container.appendChild(createDayCard(day));
            }
        }

        function renderMonthView(container) {
            const year = calendarBaseDate.getFullYear();
            const month = calendarBaseDate.getMonth();

            document.getElementById('calendarTitle').innerText = `${year}년 ${month + 1}월`;

            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);

            for (let i = 0; i < firstDay.getDay(); i++) {
                const empty = document.createElement('div');
                empty.style.background = 'transparent';
                container.appendChild(empty);
            }

            for (let d = 1; d <= lastDay.getDate(); d++) {
                const day = new Date(year, month, d);
                container.appendChild(createDayCard(day));
            }
        }

        function createDayCard(date) {
            const key = getFormattedDate(date);
            const card = document.createElement('div');
            card.className = 'day-card';

            const todayStr = getFormattedDate(new Date());
            if (key === todayStr) card.classList.add('today');

            const daysStr = ['일', '월', '화', '수', '목', '금', '토'];
            card.innerHTML = `<div class="day-number">${date.getDate()} (${daysStr[date.getDay()]})</div>`;

            if (mealData[key]) {
                const appendMealSlot = (label, text) => {
                    if (!text) return;
                    const isCheat = text.includes('[치팅]');
                    const slotClass = isCheat ? 'day-meal cheat-meal-slot' : 'day-meal';
                    card.innerHTML += `<div class="${slotClass}"><span>${label}:</span> ${text.replace('[치팅] ', '')}</div>`;
                };

                appendMealSlot('아', mealData[key].breakfast);
                appendMealSlot('점', mealData[key].lunch);
                appendMealSlot('저', mealData[key].dinner);
            }

            return card;
        }

        function toggleCalendarView() {
            if (currentCalendarMode === 'week') {
                currentCalendarMode = 'month';
                document.getElementById('viewToggleBtn').innerText = '주간 보기';
            } else {
                currentCalendarMode = 'week';
                document.getElementById('viewToggleBtn').innerText = '월간 보기';
            }
            renderCalendar();
        }

        function navigateCalendar(direction) {
            if (currentCalendarMode === 'week') {
                calendarBaseDate.setDate(calendarBaseDate.getDate() + (direction * 7));
            } else {
                calendarBaseDate.setMonth(calendarBaseDate.getMonth() + direction);
            }
            renderCalendar();
        }

        // --- 탭 전환 ---
        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));

            if (tabName === 'macros') {
                event.target.classList.add('active');
                document.getElementById('macrosForm').classList.add('active');
            } else if (tabName === 'calories') {
                event.target.classList.add('active');
                document.getElementById('caloriesForm').classList.add('active');
            } else if (tabName === 'cheat') {
                event.target.classList.add('active');
                document.getElementById('cheatForm').classList.add('active');
            }
        }

        function selectFocus(btn, type) {
            document.querySelectorAll('.focus-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            selectedFocus = type;
        }

        function setCheatPreset(menuName) {
            document.getElementById('cheatMenuInput').value = menuName;
        }

        // --- 식단 자동 조합 기능 ---
        function getRandomItem(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function generateByMacros() {
            const carb = document.getElementById('inputCarb').value;
            const protein = document.getElementById('inputProtein').value;
            const fat = document.getElementById('inputFat').value;
            const fiber = document.getElementById('inputFiber').value;
            const startDateStr = document.getElementById('macroStartDate').value;
            const days = parseInt(document.getElementById('macroDays').value);

            if (!startDateStr || !days) return alert("시작일과 적정 기간을 설정하세요.");

            pendingPlan = [];
            let curr = new Date(startDateStr);

            for (let i = 0; i < days; i++) {
                const dateKey = getFormattedDate(curr);
                
                const breakfast = `${getRandomItem(dbCarbs)}, ${getRandomItem(dbProteins)}`;
                const lunch = `${getRandomItem(dbCarbs)}, ${getRandomItem(dbProteins)}, ${getRandomItem(dbFibers)}`;
                const dinner = `${getRandomItem(dbProteins)}, ${getRandomItem(dbFibers)}`;

                pendingPlan.push({
                    date: dateKey,
                    breakfast, lunch, dinner,
                    desc: `목표 영양: 탄 ${carb}g, 단 ${protein}g, 지 ${fat}g, 식이 ${fiber}g`
                });
                curr.setDate(curr.getDate() + 1);
            }

            showPreviewModal();
        }

        function generateByCalories() {
            const cal = document.getElementById('inputCalorie').value;
            const startDateStr = document.getElementById('calStartDate').value;
            const endDateStr = document.getElementById('calEndDate').value;

            if (!startDateStr || !endDateStr) return alert("날짜를 올바르게 지정해주세요.");

            let curr = new Date(startDateStr);
            let end = new Date(endDateStr);

            if (curr > end) return alert("시작일은 종료일보다 이전이어야 합니다.");

            pendingPlan = [];

            while (curr <= end) {
                const dateKey = getFormattedDate(curr);
                let breakfast, lunch, dinner;

                if (selectedFocus === 'protein') {
                    breakfast = `${getRandomItem(dbProteins)}, 계란 1개`;
                    lunch = `잡곡밥, ${getRandomItem(dbProteins)}, ${getRandomItem(dbFibers)}`;
                    dinner = `소고기 샐러드, ${getRandomItem(dbProteins)}`;
                } else if (selectedFocus === 'fiber') {
                    breakfast = `오트밀, ${getRandomItem(dbFibers)}`;
                    lunch = `현미밥, ${getRandomItem(dbProteins)}, ${getRandomItem(dbFibers)}`;
                    dinner = `대용량 야채 샐러드, 두부구이`;
                } else {
                    breakfast = `${getRandomItem(dbCarbs)}, 바나나 1개`;
                    lunch = `${getRandomItem(dbCarbs)}, ${getRandomItem(dbProteins)}, 야채`;
                    dinner = `찐 고구마 2개, ${getRandomItem(dbProteins)}`;
                }

                pendingPlan.push({
                    date: dateKey,
                    breakfast, lunch, dinner,
                    desc: `목표: ${cal}kcal (${selectedFocus.toUpperCase()} 강조)`
                });

                curr.setDate(curr.getDate() + 1);
            }

            showPreviewModal();
        }

        // --- 치팅 데이 등록 기능 ---
        function addCheatMeal() {
            const menu = document.getElementById('cheatMenuInput').value;
            const dateKey = document.getElementById('cheatDate').value;
            const mealType = document.getElementById('cheatMealType').value;

            if (!menu || !dateKey) return alert("치팅 메뉴와 날짜를 입력해주세요.");

            if (!mealData[dateKey]) {
                mealData[dateKey] = {
                    breakfast: "건강 클린식",
                    lunch: "건강 클린식",
                    dinner: "건강 클린식"
                };
            }

            const cheatFormat = `[치팅] ${menu}`;

            if (mealType === 'all') {
                mealData[dateKey].breakfast = cheatFormat;
                mealData[dateKey].lunch = cheatFormat;
                mealData[dateKey].dinner = cheatFormat;
            } else {
                mealData[dateKey][mealType] = cheatFormat;
            }

            localStorage.setItem('mealDataStore', JSON.stringify(mealData));

            alert(`🎉 ${dateKey} 식단에 [${menu}] 치팅 메뉴가 추가되었습니다!`);
            renderTodayMeals();
            renderCalendar();
            document.getElementById('cheatMenuInput').value = '';
        }

        // --- 모달 처리 ---
        function showPreviewModal() {
            const listContainer = document.getElementById('previewList');
            listContainer.innerHTML = '';

            pendingPlan.forEach(p => {
                const item = document.createElement('div');
                item.className = 'preview-item';
                item.innerHTML = `
                    <strong>📅 ${p.date}</strong> <span style="font-size:0.75rem; color:#888;">(${p.desc})</span><br>
                    • 아침: ${p.breakfast}<br>
                    • 점심: ${p.lunch}<br>
                    • 저녁: ${p.dinner}
                `;
                listContainer.appendChild(item);
            });

            document.getElementById('confirmModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('confirmModal').style.display = 'none';
        }

        function confirmAndSave() {
            pendingPlan.forEach(p => {
                mealData[p.date] = {
                    breakfast: p.breakfast,
                    lunch: p.lunch,
                    dinner: p.dinner
                };
            });

            localStorage.setItem('mealDataStore', JSON.stringify(mealData));
            
            closeModal();
            renderTodayMeals();
            renderCalendar();
            alert("식단이 성공적으로 등록되었습니다!");
        }
    </script>
</body>
</html>
